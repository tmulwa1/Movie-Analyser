<h1>Add a Movie</h1>

<form method="POST">
    <input type="text" name="query" placeholder="Search for a movie">
    <button type="submit">Search</button>
</form>

{% for movie in results %}
    <p>
        {{ movie.title }} ({{ movie.release_year }})
        <a href="/add/confirm/{{ movie.id }}">Add to my movies</a>
    </p>
{% endfor %}
