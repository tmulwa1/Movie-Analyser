{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<h1>My Movies</h1>

<img src="{{ url_for('static', filename='charts/genre_breakdown.png') }}" alt="Genre Breakdown Chart">
<img src="{{ url_for('static', filename='charts/ratings.png') }}" alt="Ratings Over Time Chart">

<div class="movie-grid">
    {% for movie in movies %}
    <div class="movie-card">
        {% if movie.poster_path %}
        <a href="{{ url_for('movie_details', movie_id=movie.id) }}">
            <img src="{{ TMDB_IMAGE_BASE_URL }}{{ movie.poster_path }}" alt="{{ movie.title }} Poster">
        </a>
        {% endif %}
        <p>{{ movie.title }} ({{ movie.release_year }}) - My rating: {{ movie.my_rating }}</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
