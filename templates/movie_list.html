{% extends "base.html" %}
{% block title %}Movie List{% endblock %}

{% block content %}
<h1>Movie List</h1>
<div class="movie-grid">
    {% for movie in movies %}
    <div class="movie-card">
        <p>
            {% if movie.poster_path %}
            <a href="/movies/{{ movie.id }}"><img src="{{ TMDB_IMAGE_BASE_URL }}{{ movie.poster_path }}" alt="{{ movie.title }} Poster"></a>
            {% endif %}
            {{ movie.title }} ({{ movie.release_year }}) - {{ movie.my_rating }}
        </p>
    </div>
    {% endfor %}
</div>
{% endblock %}
